name: Release packages

on:
  push:
    tags:
      - 'v[0-9]*'
      - 'build-[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      package_id: ${{ steps.version.outputs.package_id }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate the release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          prerelease=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            package_id="ci-${GITHUB_SHA:0:7}"
          else
            semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[[:alnum:]-]+(\.[[:alnum:]-]+)*)?(\+[[:alnum:]-]+(\.[[:alnum:]-]+)*)?$'
            if [[ "$GITHUB_REF_NAME" =~ $semver ]]; then
              if [[ "${GITHUB_REF_NAME%%+*}" == *-* ]]; then prerelease=true; fi
            elif [[ ! "$GITHUB_REF_NAME" =~ ^build-[0-9]+$ ]]; then
              echo "Use vMAJOR.MINOR.PATCH or build-NNN for release tags." >&2
              exit 1
            fi
            package_id="${GITHUB_REF_NAME//+/_}"
          fi
          printf 'package_id=%s\nprerelease=%s\n' "$package_id" "$prerelease" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    name: Build and test ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: windows-x64, runner: windows-2025}
          - {platform: linux-x64, runner: ubuntu-24.04}
          - {platform: linux-arm64, runner: ubuntu-24.04-arm}
          - {platform: macos-x64, runner: macos-15-intel}
          - {platform: macos-arm64, runner: macos-15}
    env:
      PACKAGE_ID: ${{ needs.metadata.outputs.package_id }}
      PACKAGE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, test and package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/package-windows.ps1
      - name: Build, test and package Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: bash .github/scripts/package-unix.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.platform }}
          path: ${{ runner.temp }}/neutrino-dist/*
          if-no-files-found: error
          compression-level: 0

  assemble:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    env:
      PACKAGE_ID: ${{ needs.metadata.outputs.package_id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: packages
          merge-multiple: true
      - name: Verify packages and generate SHA-256 checksums
        working-directory: packages
        shell: bash
        run: |
          set -euo pipefail
          prefix="neutrino-$PACKAGE_ID"
          files=("$prefix-windows-x64.zip" "$prefix-linux-x64.tar.gz" "$prefix-linux-arm64.tar.gz"
                 "$prefix-macos-x64.tar.gz" "$prefix-macos-arm64.tar.gz")
          sha256sum -- "${files[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages-and-checksums
          path: packages/*
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [metadata, assemble]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages-and-checksums
          path: packages
      - name: Publish the tagged GitHub release
        working-directory: packages
        shell: bash
        env:
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          release="$GITHUB_REF_NAME"
          assets=(neutrino-*.zip neutrino-*.tar.gz SHA256SUMS.txt)
          options=()
          if [[ "$PRERELEASE" == true ]]; then options+=(--prerelease --latest=false); fi
          if existing="$(gh release view "$release" --json isDraft,assets)"; then
            missing=()
            for asset in "${assets[@]}"; do
              remote="$(jq -c --arg name "$asset" '.assets[] | select(.name == $name)' <<< "$existing")"
              if [[ -z "$remote" ]]; then
                missing+=("$asset")
              elif [[ "$(jq -r .digest <<< "$remote")" != "sha256:$(sha256sum -- "$asset" | cut -d ' ' -f 1)" ]]; then
                echo "Release asset $asset already exists with a different SHA-256." >&2
                exit 1
              fi
            done
            if (( ${#missing[@]} )); then gh release upload "$release" "${missing[@]}"; fi
            if [[ "$(jq -r .isDraft <<< "$existing")" == true ]]; then
              gh release edit "$release" --draft=false "${options[@]}"
            fi
          else
            gh release create "$release" "${assets[@]}" --verify-tag --generate-notes "${options[@]}"
          fi
